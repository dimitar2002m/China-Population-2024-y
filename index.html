<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Население на Китай 2024 г. </title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --ink:        #15110d;
    --ink-2:      #1e1712;
    --paper:      #241c15;
    --paper-line: #3d2f22;
    --seal:       #b23a2e;
    --seal-dim:   #8a2e25;
    --gold:       #c9a24b;
    --text:       #ece4d6;
    --text-dim:   #a5977f;
    --male:       #5b8fae;
    --female:     #c06e86;
    --radius:     3px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: var(--ink);
    color: var(--text);
  }
  h1, h2, h3, .serif { font-family: Georgia, 'Songti SC', 'Noto Serif', serif; }

  #map {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: radial-gradient(ellipse at 50% 45%, #241c15 0%, #17120d 62%, #0e0b08 100%);
  }
  .leaflet-container { font-family: inherit; }

  /* ===== shared panel look ===== */
  .panel {
    background: color-mix(in srgb, var(--paper) 94%, transparent);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
  }

  /* ===== top bar ===== */
  .topbar {
    position: absolute;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: linear-gradient(to bottom, rgba(13,10,7,0.92), rgba(13,10,7,0));
    pointer-events: none;
  }
  .topbar .title-block { pointer-events: auto; }
  .topbar h1 {
    font-size: 17px;
    letter-spacing: 0.2px;
    color: var(--text);
    line-height: 1.2;
  }
  .topbar h1 .mark { color: var(--seal); }
  .topbar p {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .icon-btn {
    pointer-events: auto;
    width: 38px; height: 38px;
    min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
  }
  .icon-btn:active { background: var(--seal-dim); }

  /* ===== hover info card (desktop only) ===== */
  .info {
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.5;
    min-width: 220px;
  }
  .info h3 { margin: 0 0 8px; font-size: 14px; color: var(--gold); }
  .info .row { display: flex; justify-content: space-between; gap: 12px; }
  .info .label { color: var(--text-dim); }
  .info .value { font-weight: 600; color: var(--text); }

  /* ===== legend ===== */
  .legend {
    padding: 14px 16px;
    font-size: 12px;
    line-height: 1.65;
    max-width: 230px;
  }
  .legend h4 { margin: 0 0 8px; color: var(--gold); font-size: 12.5px; font-weight: 700; letter-spacing: 0.2px; }
  .legend i {
    width: 16px; height: 12px;
    display: inline-block;
    margin-right: 8px;
    border-radius: 2px;
    vertical-align: middle;
  }
  .legend .pie-demo { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .legend .divider { margin-top: 12px; border-top: 1px solid var(--paper-line); padding-top: 8px; }
  .legend .note { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

  /* ===== national summary ===== */
  .national-box {
    padding: 14px 16px;
    font-size: 12.5px;
    line-height: 1.55;
    min-width: 220px;
  }
  .national-box h3 { margin: 0 0 8px; font-size: 13.5px; color: var(--gold); font-weight: 700; }
  .national-box .big { font-family: Georgia, serif; font-size: 20px; font-weight: 700; color: var(--text); margin: 2px 0 6px; }
  .national-box .source {
    margin-top: 9px; font-size: 10px; color: #6f6152;
    border-top: 1px solid var(--paper-line); padding-top: 7px;
  }

  /* ===== popups ===== */
  .leaflet-popup-content-wrapper { background: var(--paper); color: var(--text); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,0.55); border: 1px solid var(--paper-line); }
  .leaflet-popup-tip { background: var(--paper); }
  .leaflet-popup-content { margin: 13px 15px; font-size: 13px; }
  .popup-title { font-family: Georgia, serif; font-size: 16px; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
  .popup-row { display: flex; justify-content: space-between; gap: 16px; margin: 3px 0; }
  .popup-label { color: var(--text-dim); }
  .bar-container { height: 9px; background: var(--paper-line); border-radius: 5px; margin: 8px 0 5px; overflow: hidden; display: flex; }
  .bar-male { background: var(--male); height: 100%; }
  .bar-female { background: var(--female); height: 100%; }

  .province-label span {
    font-size: 10px;
    color: #d8cdb9;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.7);
    white-space: nowrap;
    pointer-events: none;
  }

  /* ===== leaflet chrome overrides ===== */
  .leaflet-control-zoom { border: 1px solid var(--paper-line) !important; }
  .leaflet-control-zoom a {
    background: var(--paper) !important;
    color: var(--text) !important;
    border-bottom: 1px solid var(--paper-line) !important;
  }
  .leaflet-control-zoom a:hover { background: var(--seal-dim) !important; }

  /* ===== bottom-right stack (desktop) ===== */
  .corner-stack {
    position: absolute;
    right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom, 0px));
    z-index: 850;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .corner-stack.bottom-left {
    right: auto; left: 12px;
  }

  .sheet-toggle { display: none; }

  /* ================= MOBILE ================= */
  @media (max-width: 680px) {
    .topbar { padding: 10px 10px; }
    .topbar h1 { font-size: 15px; }
    .topbar p { font-size: 10px; }

    /* hover-only panel is meaningless on touch */
    .info { display: none !important; }

    .leaflet-control-zoom { display: none; }

    /* hide the floating desktop panels; a single sheet replaces them */
    .corner-stack { display: none; }

    .sheet-toggle {
      display: flex;
      position: absolute;
      right: 10px;
      bottom: max(14px, env(safe-area-inset-bottom, 0px));
      z-index: 950;
      gap: 8px;
      pointer-events: auto;
    }

    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 1000;
      background: var(--paper);
      border-top: 1px solid var(--paper-line);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -12px 30px rgba(0,0,0,0.55);
      max-height: 62vh;
      overflow-y: auto;
      padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform 0.22s ease-out;
    }
    .sheet.open { transform: translateY(0); }
    .sheet .grabber {
      width: 36px; height: 4px; border-radius: 2px;
      background: var(--paper-line);
      margin: 0 auto 14px;
    }
    .sheet-section + .sheet-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--paper-line); }

    .leaflet-popup-content-wrapper { max-width: 78vw; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="title-block panel" style="padding:9px 14px; background:color-mix(in srgb, var(--paper) 96%, transparent);">
    <h1><span class="mark">·</span> Население на Китай 2024 г.</h1>
    <p>Гъстота на населението и съотношение мъже / жени, по провинции</p>
  </div>
</div>

<!-- Mobile bottom-sheet toggle buttons -->
<div class="sheet-toggle">
  <button class="icon-btn" id="toggleLegend" aria-label="Легенда" title="Легенда">▤</button>
  <button class="icon-btn" id="toggleStats" aria-label="Обобщени данни" title="Обобщени данни">Σ</button>
</div>

<!-- Mobile bottom sheet (built from the same content as the desktop panels) -->
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div id="sheetContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="china_data.js"></script>
<script>
  // ===== Map (no basemap tile requests — provinces render on a plain ink backdrop) =====
  const map = L.map('map', {
    center: [35.5, 104],
    zoom: 4,
    minZoom: 3,
    maxZoom: 10,
    zoomControl: false,
    attributionControl: false
  });
  L.control.zoom({ position: 'topright' }).addTo(map);

  // ===== Color scale for density =====
  function getDensityColor(d) {
    return d > 1000 ? '#7a1f1a' :
           d > 500  ? '#a12c22' :
           d > 300  ? '#c1402d' :
           d > 150  ? '#d97a2e' :
           d > 80   ? '#c9a24b' :
           d > 30   ? '#8a9c4e' :
           d > 10   ? '#4f8f5b' :
                      '#2f5f45';
  }

  function style(feature) {
    const dens = feature.properties.Density_Pop_km2 || 0;
    return {
      fillColor: getDensityColor(dens),
      weight: 1.1,
      opacity: 1,
      color: '#0e0b08',
      fillOpacity: 0.78
    };
  }

  // ===== Format helpers =====
  function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + ' млрд';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + ' млн';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + ' хил.';
    return n.toLocaleString('bg-BG');
  }

  function popupContent(props) {
    const malePct = (props.Pop_Male / props.Pop_Total_Absolute * 100).toFixed(1);
    const femalePct = (props.Pop_Female / props.Pop_Total_Absolute * 100).toFixed(1);
    const nameBG = props.Region_BG || props.Region;
    return `
      <div class="popup-title">${nameBG}</div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">${props.name_zh || ''} · ${props.Region}</div>
      <div class="popup-row"><span class="popup-label">Общо население</span><span>${fmt(props.Pop_Total_Absolute)}</span></div>
      <div class="popup-row"><span class="popup-label">Мъже</span><span style="color:var(--male)">${fmt(props.Pop_Male)} (${malePct}%)</span></div>
      <div class="popup-row"><span class="popup-label">Жени</span><span style="color:var(--female)">${fmt(props.Pop_Female)} (${femalePct}%)</span></div>
      <div class="bar-container">
        <div class="bar-male" style="width:${malePct}%"></div>
        <div class="bar-female" style="width:${femalePct}%"></div>
      </div>
      <div class="popup-row"><span class="popup-label">Площ</span><span>${props.Area_km2.toLocaleString('bg-BG')} км²</span></div>
      <div class="popup-row"><span class="popup-label">Гъстота</span><span><b>${props.Density_Pop_km2}</b> души/км²</span></div>
    `;
  }

  const isMobile = () => window.matchMedia('(max-width: 680px)').matches;

  // ===== Choropleth layer =====
  const geoLayer = L.geoJSON(chinaData, {
    style: style,
    onEachFeature: function (feature, layer) {
      layer.bindPopup(popupContent(feature.properties), { maxWidth: 280 });
      layer.on({
        mouseover: function (e) {
          if (isMobile()) return;
          e.target.setStyle({ weight: 2.2, color: '#c9a24b', fillOpacity: 0.92 });
          e.target.bringToFront();
          info.update(feature.properties);
        },
        mouseout: function (e) {
          if (isMobile()) return;
          geoLayer.resetStyle(e.target);
          info.update();
        }
      });
    }
  }).addTo(map);

  // ===== Pie chart markers (male / female) =====
  function createPieIcon(male, female, size) {
    const total = male + female;
    const malePct = male / total;
    const r = size / 2;
    const cx = r, cy = r;
    const maleAngle = malePct * 360;
    const large = maleAngle > 180 ? 1 : 0;
    const rad = (deg) => (deg - 90) * Math.PI / 180;
    const x1 = cx + r * Math.cos(rad(0));
    const y1 = cy + r * Math.sin(rad(0));
    const x2 = cx + r * Math.cos(rad(maleAngle));
    const y2 = cy + r * Math.sin(rad(maleAngle));

    const svg = `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="#c06e86"/>
        <path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="#5b8fae"/>
        <circle cx="${cx}" cy="${cy}" r="${r * 0.35}" fill="#15110d" opacity="0.88"/>
      </svg>`;
    return L.divIcon({
      html: svg,
      className: '',
      iconSize: [size, size],
      iconAnchor: [r, r]
    });
  }

  const pops = chinaData.features.map(f => f.properties.Pop_Total_Absolute);
  const minPop = Math.min(...pops);
  const maxPop = Math.max(...pops);

  function getSize(pop) {
    const t = (pop - minPop) / (maxPop - minPop);
    return (isMobile() ? 14 : 18) + t * (isMobile() ? 22 : 30);
  }

  function centroidOf(feature) {
    try {
      const coords = feature.geometry.coordinates;
      let ring = coords[0];
      if (feature.geometry.type === 'MultiPolygon') ring = coords[0][0];
      let sumLng = 0, sumLat = 0;
      ring.forEach(c => { sumLng += c[0]; sumLat += c[1]; });
      return [sumLat / ring.length, sumLng / ring.length];
    } catch (e) {
      return null;
    }
  }

  const pieMarkers = [];
  chinaData.features.forEach(f => {
    const p = f.properties;
    const c = centroidOf(f);
    if (!c) return;
    const size = getSize(p.Pop_Total_Absolute);
    const marker = L.marker(c, {
      icon: createPieIcon(p.Pop_Male, p.Pop_Female, size),
      interactive: true
    });
    marker.bindPopup(popupContent(p), { maxWidth: 280 });
    marker.addTo(map);
    pieMarkers.push(marker);
  });

  // ===== Hover info control (desktop only, hidden on mobile via CSS) =====
  const info = L.control({ position: 'topright' });
  info.onAdd = function () {
    this._div = L.DomUtil.create('div', 'info panel');
    this.update();
    return this._div;
  };
  info.update = function (props) {
    if (!props) {
      this._div.innerHTML = '<h3>Задръж мишката</h3><div style="color:var(--text-dim)">върху провинция за подробности</div>';
      return;
    }
    this._div.innerHTML = `
      <h3>${props.Region_BG || props.Region}</h3>
      <div class="row"><span class="label">Население</span><span class="value">${fmt(props.Pop_Total_Absolute)}</span></div>
      <div class="row"><span class="label">Мъже</span><span class="value" style="color:var(--male)">${fmt(props.Pop_Male)}</span></div>
      <div class="row"><span class="label">Жени</span><span class="value" style="color:var(--female)">${fmt(props.Pop_Female)}</span></div>
      <div class="row"><span class="label">Гъстота</span><span class="value">${props.Density_Pop_km2} д./км²</span></div>
    `;
  };
  info.addTo(map);

  // ===== Legend content (shared by desktop panel + mobile sheet) =====
  function legendHTML() {
    const grades = [0, 10, 30, 80, 150, 300, 500, 1000];
    let rows = '';
    for (let i = 0; i < grades.length; i++) {
      const from = grades[i];
      const to = grades[i + 1];
      rows += `<div><i style="background:${getDensityColor(from + 1)}"></i> ${from}${to ? ' – ' + to : '+'}</div>`;
    }
    return `
      <h4>Гъстота (души/км²)</h4>
      ${rows}
      <div class="divider">
        <strong style="font-size:12px;">Кръгови диаграми</strong>
        <div class="pie-demo">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="10" fill="#c06e86"/>
            <path d="M10 10 L10 0 A10 10 0 0 1 19.5 15 Z" fill="#5b8fae"/>
          </svg>
          <span><span style="color:var(--male)">■</span> Мъже &nbsp; <span style="color:var(--female)">■</span> Жени</span>
        </div>
        <div class="note">Размер = общо население</div>
        <div class="note">Цвят на областите = гъстота</div>
      </div>
    `;
  }

  function nationalHTML() {
    return `
      <h3>Общо за Китай</h3>
      <div style="color:var(--text-dim)">Население (по области)</div>
      <div class="big">1,41 млрд. души</div>
      <div style="margin-top:6px">
        <div><span style="color:var(--text-dim)">ООН 2024:</span> <b>1,42 млрд. души</b></div>
        <div><span style="color:var(--text-dim)">Официално 2024:</span> <b>1,41 млрд. души</b></div>
      </div>
      <div class="source">
        Източник: National Bureau of Statistics of China<br>
        Средна гъстота: 146,3 души/км²
      </div>
    `;
  }

  // ===== Desktop corner panels =====
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend panel');
    div.innerHTML = legendHTML();
    return div;
  };
  legend.addTo(map);

  const national = L.control({ position: 'bottomleft' });
  national.onAdd = function () {
    const div = L.DomUtil.create('div', 'national-box panel');
    div.innerHTML = nationalHTML();
    return div;
  };
  national.addTo(map);

  // wrap the two default corner controls so we can hide them together on mobile via CSS
  document.querySelectorAll('.leaflet-bottom.leaflet-right').forEach(el => el.classList.add('corner-stack'));
  document.querySelectorAll('.leaflet-bottom.leaflet-left').forEach(el => el.classList.add('corner-stack', 'bottom-left'));

  // ===== Mobile bottom sheet =====
  const sheet = document.getElementById('sheet');
  const sheetContent = document.getElementById('sheetContent');
  const btnLegend = document.getElementById('toggleLegend');
  const btnStats = document.getElementById('toggleStats');
  let sheetMode = null;

  function openSheet(mode) {
    if (sheetMode === mode && sheet.classList.contains('open')) {
      sheet.classList.remove('open');
      sheetMode = null;
      return;
    }
    sheetContent.innerHTML = mode === 'legend'
      ? `<div class="sheet-section legend">${legendHTML()}</div>`
      : `<div class="sheet-section national-box">${nationalHTML()}</div>`;
    sheet.classList.add('open');
    sheetMode = mode;
  }

  btnLegend.addEventListener('click', () => openSheet('legend'));
  btnStats.addEventListener('click', () => openSheet('stats'));
  map.on('click movestart', () => { sheet.classList.remove('open'); sheetMode = null; });

  // ===== Province labels (Bulgarian), shown above a zoom threshold =====
  const labelLayer = L.layerGroup();
  chinaData.features.forEach(f => {
    const p = f.properties;
    const c = centroidOf(f);
    if (!c) return;
    const name = p.Region_BG || p.Region;
    const label = L.marker(c, {
      icon: L.divIcon({
        className: 'province-label',
        html: `<span>${name}</span>`,
        iconSize: [80, 18],
        iconAnchor: [40, 9]
      }),
      interactive: false
    });
    labelLayer.addLayer(label);
  });
  labelLayer.addTo(map);

  function updateLabels() {
    const threshold = isMobile() ? 6 : 5;
    if (map.getZoom() >= threshold) {
      if (!map.hasLayer(labelLayer)) map.addLayer(labelLayer);
    } else {
      if (map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
    }
  }
  map.on('zoomend', updateLabels);
  updateLabels();

  // Fit bounds & keep the view roughly over China
  map.fitBounds(geoLayer.getBounds().pad(0.02));
  map.setMaxBounds([[12, 65], [58, 145]]);

  window.addEventListener('resize', () => { updateLabels(); });
</script>
</body>
</html>
